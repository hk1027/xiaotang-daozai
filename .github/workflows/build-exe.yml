name: 构建 Windows exe
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: 构建
        run: cargo build --locked --release --bin daozai --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: daozai-commandcode
          path: target/x86_64-pc-windows-msvc/release/daozai.exe
          if-no-files-found: error
